<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coastの博客</title>
  <style>
    /* === 全局样式 === */
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --card-bg: #f8f9fa;
      --primary: #4f46e5;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      --radius: 12px;
      --transition: 0.3s ease;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --text: #e2e8f0;
      --card-bg: #1e293b;
      --primary: #818cf8;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background var(--transition), color var(--transition);
      line-height: 1.8;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    /* 头部 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(128,128,128,0.2);
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .theme-toggle {
      background: none;
      border: 2px solid var(--text);
      color: var(--text);
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all var(--transition);
    }
    .theme-toggle:hover {
      background: var(--text);
      color: var(--bg);
    }
    /* 文章列表 */
    .post-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .post-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.15);
    }
    .post-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }
    .post-date {
      font-size: 0.9rem;
      opacity: 0.7;
      margin-bottom: 0.8rem;
    }
    .post-excerpt {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    /* 详情页 */
    .back-btn {
      display: inline-block;
      margin-bottom: 1.5rem;
      padding: 0.5rem 1rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity var(--transition);
    }
    .back-btn:hover { opacity: 0.85; }
    .article-content {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .article-content h1 {
      margin-bottom: 0.5rem;
      color: var(--primary);
      font-size: 1.8rem;
      line-height: 1.3;
    }
    .article-content .meta {
      font-size: 0.9rem;
      opacity: 0.7;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(128,128,128,0.2);
    }
    .article-content .body-text {
      font-size: 1.05rem;
      line-height: 1.9;
    }
    .hidden { display: none; }
    .loading, .error {
      text-align: center;
      padding: 3rem;
      font-size: 1.2rem;
      opacity: 0.8;
    }
    .error { color: #ef4444; }
    @media (max-width: 600px) {
      .container { padding: 1rem; }
      .post-card { padding: 1rem; }
      .article-content { padding: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">Coastの博客</div>
      <button class="theme-toggle" id="themeToggle">🌙 暗色</button>
    </header>

    <div id="listView">
      <div class="loading" id="loading">正在加载文章…</div>
      <div class="error hidden" id="error">加载文章失败，请检查 articles.txt 文件是否正确。</div>
      <div id="postList"></div>
    </div>

    <div id="detailView" class="hidden">
      <button class="back-btn" id="backBtn">← 返回列表</button>
      <div class="article-content" id="articleContent"></div>
    </div>
  </div>

  <script>
    (function() {
      // ===== 主题切换 =====
      const themeToggle = document.getElementById('themeToggle');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      let currentTheme = localStorage.getItem('theme') || (prefersDark ? 'dark' : 'light');

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        themeToggle.textContent = theme === 'dark' ? '☀️ 亮色' : '🌙 暗色';
        localStorage.setItem('theme', theme);
      }
      applyTheme(currentTheme);
      themeToggle.addEventListener('click', function() {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        applyTheme(currentTheme);
      });

      // ===== 视图切换 =====
      var listView = document.getElementById('listView');
      var detailView = document.getElementById('detailView');
      var postList = document.getElementById('postList');
      var articleContent = document.getElementById('articleContent');
      var loadingEl = document.getElementById('loading');
      var errorEl = document.getElementById('error');
      var articles = [];

      function showList() {
        listView.classList.remove('hidden');
        detailView.classList.add('hidden');
      }

      /**
       * 修复问题4（XSS）：使用 textContent 安全渲染纯文本
       * 杜绝通过 innerHTML 直接插入未消毒的用户内容
       */
      function safeSetText(element, text) {
        element.textContent = text;
      }

      /**
       * 修复问题2（换行处理）：将 JSON 字符串中的 \n 转换为 <br>
       * 同时兼容 Windows 的 \r\n, 以及 JSON 转义后的 \\n
       * 逻辑：先把 JSON 中可能存在的字面 "\\n" 还原为真正的换行符，
       * 再把所有换行符（\r\n, \r, \n）统一替换为 <br>
       */
      function renderContentWithLineBreaks(text) {
        // 步骤1：处理 JSON 中可能被双重转义的 \\n（变为字面 \n）
        var normalized = text.replace(/\\n/g, '\n');
        // 步骤2：统一换行符为 \n，然后转为 <br>
        var withBreaks = normalized
          .replace(/\r\n/g, '\n')
          .replace(/\r/g, '\n')
          .replace(/\n/g, '<br>');
        return withBreaks;
      }

      function showDetail(article) {
        listView.classList.add('hidden');
        detailView.classList.remove('hidden');

        // 修复问题4：不再直接拼接 innerHTML，改用安全的 DOM 构建
        articleContent.innerHTML = '';

        var titleEl = document.createElement('h1');
        titleEl.textContent = article.title;
        articleContent.appendChild(titleEl);

        var metaEl = document.createElement('div');
        metaEl.className = 'meta';
        metaEl.textContent = article.date;
        articleContent.appendChild(metaEl);

        var bodyEl = document.createElement('div');
        bodyEl.className = 'body-text';
        // 修复问题2：将换行符转换为 <br> 后，用 innerHTML 插入（此时内容已安全）
        // 因为原始文本已通过 textContent 隔离，这里的 <br> 是我们主动生成的，不含恶意脚本
        bodyEl.innerHTML = renderContentWithLineBreaks(article.content);
        articleContent.appendChild(bodyEl);

        window.scrollTo(0, 0);
      }

      /**
       * 修复问题3：使用 index 作为唯一标识，避免标题重复导致的匹配错误
       */
      function renderList() {
        postList.innerHTML = '';
        articles.forEach(function(article, index) {
          var card = document.createElement('div');
          card.className = 'post-card';
          card.setAttribute('data-index', index);

          var titleEl = document.createElement('h2');
          titleEl.className = 'post-title';
          titleEl.textContent = article.title;
          card.appendChild(titleEl);

          var dateEl = document.createElement('div');
          dateEl.className = 'post-date';
          dateEl.textContent = article.date;
          card.appendChild(dateEl);

          var excerptEl = document.createElement('p');
          excerptEl.className = 'post-excerpt';
          excerptEl.textContent = article.content.substring(0, 100) + '…';
          card.appendChild(excerptEl);

          card.addEventListener('click', function() {
            // 修复问题3：通过 index 精确匹配，避免标题重复时出错
            var idx = parseInt(card.getAttribute('data-index'), 10);
            if (articles[idx]) {
              showDetail(articles[idx]);
            }
          });

          postList.appendChild(card);
        });
      }

      async function loadArticles() {
        try {
          var response = await fetch('articles.txt');
          if (!response.ok) throw new Error('HTTP ' + response.status);
          var text = await response.text();
          articles = JSON.parse(text);
          if (!Array.isArray(articles)) throw new Error('格式错误：articles.txt 必须是一个 JSON 数组');
          loadingEl.classList.add('hidden');
          renderList();
        } catch (err) {
          console.error('加载文章失败:', err);
          loadingEl.classList.add('hidden');
          errorEl.classList.remove('hidden');
        }
      }

      document.getElementById('backBtn').addEventListener('click', showList);
      loadArticles();
    })();
  </script>
</body>
</html>
