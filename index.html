<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coastの博客</title>
  <style>
    /* ==================== CSS 变量与全局 ==================== */
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #6b7280;
      --card-bg: #f8f9fa;
      --primary: #4f46e5;
      --primary-light: #818cf8;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 12px 20px -8px rgba(0, 0, 0, 0.12);
      --radius: 12px;
      --transition: 0.3s ease;
      --border: rgba(128, 128, 128, 0.15);
      --cover-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --text: #e2e8f0;
      --text-secondary: #94a3b8;
      --card-bg: #1e293b;
      --primary: #818cf8;
      --primary-light: #a5b4fc;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      --shadow-hover: 0 12px 20px -8px rgba(0, 0, 0, 0.4);
      --border: rgba(148, 163, 184, 0.15);
      --cover-bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
      /* 滚动吸附：让封面页和列表页各占一个视口高度 */
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
      height: 100vh;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background var(--transition), color var(--transition);
      line-height: 1.8;
    }

    /* ==================== 进度条 ==================== */
    #progressBar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), #7c3aed);
      width: 0%;
      z-index: 1000;
      transition: width 0.1s linear;
      pointer-events: none;
    }

    /* ==================== 封面首页 ==================== */
    .cover-section {
      height: 100vh;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--cover-bg);
      position: relative;
      overflow: hidden;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }

    /* 封面装饰粒子 */
    .cover-particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }

    .cover-content {
      position: relative;
      z-index: 1;
      animation: coverFadeIn 1s ease;
    }
    @keyframes coverFadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .cover-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 3px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .cover-title {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .cover-subtitle {
      font-size: clamp(1rem, 2vw, 1.3rem);
      opacity: 0.85;
      margin-bottom: 2rem;
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    .cover-divider {
      width: 60px;
      height: 3px;
      background: rgba(255, 255, 255, 0.6);
      margin: 0 auto 2rem;
      border-radius: 2px;
    }

    /* 向上滑动提示 */
    .scroll-hint {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      animation: bounce 2s infinite;
      cursor: pointer;
    }
    .scroll-hint span {
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      opacity: 0.8;
    }
    .scroll-hint .arrow {
      font-size: 1.5rem;
      line-height: 1;
    }
    @keyframes bounce {
      0%,
      100% {
        transform: translateX(-50%) translateY(0);
      }
      50% {
        transform: translateX(-50%) translateY(8px);
      }
    }

    /* 主题切换（封面页内） */
    .cover-theme-toggle {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 2;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all var(--transition);
      white-space: nowrap;
    }
    .cover-theme-toggle:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* ==================== 文章列表区域 ==================== */
    .list-section {
      min-height: 100vh;
      scroll-snap-align: start;
      background: var(--bg);
      padding-top: 1rem;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* 头部 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .theme-toggle {
      background: none;
      border: 2px solid var(--text-secondary);
      color: var(--text-secondary);
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all var(--transition);
      white-space: nowrap;
    }
    .theme-toggle:hover {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    /* 搜索框 */
    .search-wrapper {
      position: relative;
      margin-bottom: 1.5rem;
    }
    .search-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
      transition: border-color var(--transition), box-shadow var(--transition);
      outline: none;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }
    .search-input::placeholder {
      color: var(--text-secondary);
      opacity: 0.7;
    }
    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: var(--text-secondary);
      pointer-events: none;
      opacity: 0.6;
    }
    .no-result {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
      font-size: 1rem;
      display: none;
    }

    /* 文章卡片 */
    .post-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.2rem;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition);
      border: 1px solid var(--border);
      position: relative;
    }
    .post-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }
    .post-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .pin-badge {
      font-size: 1rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .post-date {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 0.7rem;
    }
    .post-excerpt {
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 0.95rem;
    }

    /* 详情页 */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 1.5rem;
      padding: 0.5rem 1rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity var(--transition), transform var(--transition);
    }
    .back-btn:hover {
      opacity: 0.85;
      transform: translateX(-2px);
    }
    .article-content {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .article-content h1 {
      margin-bottom: 0.5rem;
      color: var(--primary);
      font-size: 1.8rem;
      line-height: 1.3;
    }
    .article-content .meta {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .article-content .body-text {
      font-size: 1.05rem;
      line-height: 1.9;
    }

    /* ==================== 返回顶部按钮 ==================== */
    #backToTop {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 1.3rem;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s, transform 0.3s;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
      z-index: 998;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    #backToTop.visible {
      opacity: 1;
      visibility: visible;
    }
    #backToTop:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.45);
    }

    /* ==================== 动画 ==================== */
    .fade-in {
      animation: fadeIn 0.35s ease;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==================== 工具类 ==================== */
    .hidden {
      display: none;
    }
    .loading,
    .error {
      text-align: center;
      padding: 3rem;
      font-size: 1.1rem;
      color: var(--text-secondary);
    }
    .error {
      color: #ef4444;
    }

    /* ==================== 响应式 ==================== */
    @media (max-width: 600px) {
      .container {
        padding: 1rem 1rem 3rem;
      }
      .post-card {
        padding: 1rem;
      }
      .article-content {
        padding: 1.2rem;
      }
      .post-title {
        font-size: 1.2rem;
      }
      .article-content h1 {
        font-size: 1.5rem;
      }
      .cover-avatar {
        width: 70px;
        height: 70px;
        font-size: 2rem;
      }
      .cover-title {
        font-size: 1.8rem;
      }
      #backToTop {
        bottom: 1.2rem;
        right: 1.2rem;
        width: 42px;
        height: 42px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <!-- 阅读进度条 -->
  <div id="progressBar"></div>

  <!-- ==================== 封面首页 ==================== -->
  <section class="cover-section" id="coverSection">
    <!-- 粒子背景 -->
    <div class="cover-particles" id="particles"></div>

    <!-- 主题切换 -->
    <button class="cover-theme-toggle" id="coverThemeToggle">🌙 暗色</button>

    <!-- 封面内容 -->
    <div class="cover-content">
      <div class="cover-avatar">😎</div>
      <h1 class="cover-title">Coastの博客</h1>
      <p class="cover-subtitle">记录思考 · 分享快乐 · 探索未知</p>
      <div class="cover-divider"></div>
    </div>

    <!-- 向上滑动提示 -->
    <div class="scroll-hint" id="scrollHint">
      <span>向上滑动阅读</span>
      <span class="arrow">↑</span>
    </div>
  </section>

  <!-- ==================== 文章列表区域 ==================== -->
  <section class="list-section" id="listSection">
    <div class="container">
      <!-- 头部 -->
      <header class="header">
        <div class="logo">Coastの博客</div>
        <button class="theme-toggle" id="themeToggle">🌙 暗色</button>
      </header>

      <!-- 列表视图 -->
      <div id="listView">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="搜索文章标题或内容…"
            autocomplete="off"
          >
        </div>
        <div class="no-result" id="noResult">没有找到匹配的文章</div>
        <div class="loading" id="loading">正在加载文章…</div>
        <div class="error hidden" id="error">
          加载文章失败，请检查 articles.txt 文件是否正确。
        </div>
        <div id="postList"></div>
      </div>

      <!-- 详情视图 -->
      <div id="detailView" class="hidden">
        <button class="back-btn" id="backBtn">← 返回列表</button>
        <div class="article-content" id="articleContent"></div>
      </div>
    </div>
  </section>

  <!-- 返回顶部按钮 -->
  <button id="backToTop" title="返回顶部">↑</button>

  <script>
    (function () {
      // ==================== 主题切换 ====================
      const prefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;
      let currentTheme =
        localStorage.getItem("blog-theme") ||
        (prefersDark ? "dark" : "light");

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        const themeText = theme === "dark" ? "☀️ 亮色" : "🌙 暗色";
        document.getElementById("themeToggle").textContent = themeText;
        document.getElementById("coverThemeToggle").textContent = themeText;
        localStorage.setItem("blog-theme", theme);
      }
      applyTheme(currentTheme);

      document.getElementById("themeToggle").addEventListener("click", function () {
        currentTheme = currentTheme === "dark" ? "light" : "dark";
        applyTheme(currentTheme);
      });
      document.getElementById("coverThemeToggle").addEventListener("click", function () {
        currentTheme = currentTheme === "dark" ? "light" : "dark";
        applyTheme(currentTheme);
      });

      // ==================== 封面粒子效果 ====================
      function createParticles() {
        const container = document.getElementById("particles");
        const count = 30;
        for (let i = 0; i < count; i++) {
          const particle = document.createElement("div");
          particle.className = "particle";
          const size = Math.random() * 8 + 3;
          particle.style.width = size + "px";
          particle.style.height = size + "px";
          particle.style.left = Math.random() * 100 + "%";
          particle.style.animationDuration = Math.random() * 8 + 6 + "s";
          particle.style.animationDelay = Math.random() * 5 + "s";
          container.appendChild(particle);
        }
      }
      createParticles();

      // ==================== DOM 引用 ====================
      const listView = document.getElementById("listView");
      const detailView = document.getElementById("detailView");
      const postList = document.getElementById("postList");
      const articleContent = document.getElementById("articleContent");
      const loadingEl = document.getElementById("loading");
      const errorEl = document.getElementById("error");
      const searchInput = document.getElementById("searchInput");
      const noResult = document.getElementById("noResult");
      const backToTop = document.getElementById("backToTop");
      const progressBar = document.getElementById("progressBar");
      const scrollHint = document.getElementById("scrollHint");

      let articles = [];

      // ==================== 动画辅助 ====================
      function triggerFadeIn(el) {
        el.classList.remove("fade-in");
        void el.offsetWidth; // 强制重排
        el.classList.add("fade-in");
      }

      // ==================== 视图切换 ====================
      function showList() {
        detailView.classList.add("hidden");
        listView.classList.remove("hidden");
        triggerFadeIn(listView);
        searchInput.value = "";
        filterArticles("");
        // 滚动到列表区域
        document.getElementById("listSection").scrollIntoView({ behavior: "smooth" });
      }

      function showDetail(article) {
        articleContent.innerHTML = "";
        const titleEl = document.createElement("h1");
        titleEl.textContent = article.title;
        articleContent.appendChild(titleEl);

        const metaEl = document.createElement("div");
        metaEl.className = "meta";
        metaEl.textContent = article.date;
        articleContent.appendChild(metaEl);

        const bodyEl = document.createElement("div");
        bodyEl.className = "body-text";
        bodyEl.innerHTML = renderContentWithLineBreaks(article.content);
        articleContent.appendChild(bodyEl);

        listView.classList.add("hidden");
        detailView.classList.remove("hidden");
        triggerFadeIn(detailView);
        // 滚动到列表区域顶部
        document.getElementById("listSection").scrollIntoView({ behavior: "smooth" });
      }

      function renderContentWithLineBreaks(text) {
        let normalized = text.replace(/\\n/g, "\n");
        return normalized
          .replace(/\r\n/g, "\n")
          .replace(/\r/g, "\n")
          .replace(/\n/g, "<br>");
      }

      // ==================== 搜索过滤 ====================
      function filterArticles(keyword) {
        const cards = postList.querySelectorAll(".post-card");
        let visibleCount = 0;
        cards.forEach(function (card) {
          const text = card.textContent.toLowerCase();
          if (text.includes(keyword)) {
            card.style.display = "";
            visibleCount++;
          } else {
            card.style.display = "none";
          }
        });
        noResult.style.display =
          visibleCount === 0 && articles.length > 0 ? "block" : "none";
      }

      searchInput.addEventListener("input", function () {
        filterArticles(this.value.toLowerCase().trim());
      });

      // ==================== 渲染文章列表 ====================
      function renderList() {
        postList.innerHTML = "";
        noResult.style.display = "none";

        articles.forEach(function (article, index) {
          const card = document.createElement("div");
          card.className = "post-card";
          card.setAttribute("data-index", index);

          const titleEl = document.createElement("h2");
          titleEl.className = "post-title";
          if (article.pinned) {
            const badge = document.createElement("span");
            badge.className = "pin-badge";
            badge.textContent = "📌";
            titleEl.appendChild(badge);
          }
          titleEl.appendChild(document.createTextNode(article.title));
          card.appendChild(titleEl);

          const dateEl = document.createElement("div");
          dateEl.className = "post-date";
          dateEl.textContent = article.date;
          card.appendChild(dateEl);

          const excerptEl = document.createElement("p");
          excerptEl.className = "post-excerpt";
          excerptEl.textContent =
            article.content.replace(/\\n/g, " ").substring(0, 120) + "…";
          card.appendChild(excerptEl);

          card.addEventListener("click", function () {
            const idx = parseInt(card.getAttribute("data-index"), 10);
            if (articles[idx]) {
              showDetail(articles[idx]);
            }
          });

          postList.appendChild(card);
        });
      }

      // ==================== 加载文章数据 ====================
      async function loadArticles() {
        try {
          const response = await fetch("articles.txt");
          if (!response.ok) throw new Error("HTTP " + response.status);
          const text = await response.text();
          const data = JSON.parse(text);
          if (!Array.isArray(data))
            throw new Error("articles.txt 必须是一个 JSON 数组");

          articles = data.sort(function (a, b) {
            if (a.pinned && !b.pinned) return -1;
            if (!a.pinned && b.pinned) return 1;
            return 0;
          });

          loadingEl.classList.add("hidden");
          renderList();
        } catch (err) {
          console.error("加载文章失败:", err);
          loadingEl.classList.add("hidden");
          errorEl.classList.remove("hidden");
        }
      }

      // ==================== 进度条 ====================
      function updateProgressBar() {
        const scrollTop = window.scrollY;
        const docHeight =
          document.documentElement.scrollHeight - window.innerHeight;
        if (docHeight <= 0) {
          progressBar.style.width = "0%";
          return;
        }
        const progress = Math.min((scrollTop / docHeight) * 100, 100);
        progressBar.style.width = progress + "%";
      }
      window.addEventListener("scroll", updateProgressBar, { passive: true });
      updateProgressBar();

      // ==================== 返回顶部按钮 ====================
      function updateBackToTop() {
        if (window.scrollY > 400) {
          backToTop.classList.add("visible");
        } else {
          backToTop.classList.remove("visible");
        }
      }
      window.addEventListener("scroll", updateBackToTop, { passive: true });
      updateBackToTop();

      backToTop.addEventListener("click", function () {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      // ==================== 返回列表按钮 ====================
      document.getElementById("backBtn").addEventListener("click", showList);

      // ==================== 封面 "向上滑动" 提示点击 ====================
      scrollHint.addEventListener("click", function () {
        document.getElementById("listSection").scrollIntoView({ behavior: "smooth" });
      });

      // ==================== 检测封面是否可见，隐藏/显示提示 ====================
      const coverSection = document.getElementById("coverSection");
      const observer = new IntersectionObserver(
        function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              scrollHint.style.opacity = "1";
            } else {
              scrollHint.style.opacity = "0";
            }
          });
        },
        { threshold: 0.5 }
      );
      observer.observe(coverSection);

      // ==================== 启动 ====================
      loadArticles();
    })();
  </script>
</body>
</html>
