<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coastの博客</title>
  <style>
    /* ========== CSS 变量与全局 ========== */
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #6b7280;
      --card-bg: #f8f9fa;
      --primary: #4f46e5;
      --primary-light: #818cf8;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-hover: 0 12px 20px -8px rgba(0,0,0,0.12);
      --radius: 12px;
      --transition: 0.3s ease;
      --border: rgba(128,128,128,0.15);
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --text: #e2e8f0;
      --text-secondary: #94a3b8;
      --card-bg: #1e293b;
      --primary: #818cf8;
      --primary-light: #a5b4fc;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      --shadow-hover: 0 12px 20px -8px rgba(0,0,0,0.4);
      --border: rgba(148,163,184,0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background var(--transition), color var(--transition);
      line-height: 1.8;
      min-height: 100vh;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ========== 进度条 ========== */
    #progressBar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), #7c3aed);
      width: 0%;
      z-index: 1000;
      transition: width 0.1s linear;
    }

    /* ========== 头部 ========== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .theme-toggle {
      background: none;
      border: 2px solid var(--text-secondary);
      color: var(--text-secondary);
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all var(--transition);
      white-space: nowrap;
    }
    .theme-toggle:hover {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    /* ========== 搜索框 ========== */
    .search-wrapper {
      margin-bottom: 1.5rem;
    }
    .search-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
      transition: border-color var(--transition), box-shadow var(--transition);
      outline: none;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
    }
    .search-input::placeholder {
      color: var(--text-secondary);
      opacity: 0.7;
    }
    .search-wrapper {
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: var(--text-secondary);
      pointer-events: none;
      opacity: 0.6;
    }
    .no-result {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
      font-size: 1rem;
      display: none;
    }

    /* ========== 文章卡片 ========== */
    .post-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.2rem;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition);
      border: 1px solid var(--border);
      position: relative;
    }
    .post-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }
    .post-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .pin-badge {
      font-size: 1rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .post-date {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 0.7rem;
    }
    .post-excerpt {
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 0.95rem;
    }

    /* ========== 详情页 ========== */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 1.5rem;
      padding: 0.5rem 1rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity var(--transition), transform var(--transition);
    }
    .back-btn:hover {
      opacity: 0.85;
      transform: translateX(-2px);
    }
    .article-content {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .article-content h1 {
      margin-bottom: 0.5rem;
      color: var(--primary);
      font-size: 1.8rem;
      line-height: 1.3;
    }
    .article-content .meta {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .article-content .body-text {
      font-size: 1.05rem;
      line-height: 1.9;
    }

    /* ========== 返回顶部按钮 ========== */
    #backToTop {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 1.3rem;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s, transform 0.3s;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
      z-index: 998;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    #backToTop.visible {
      opacity: 1;
      visibility: visible;
    }
    #backToTop:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.45);
    }

    /* ========== 动画 ========== */
    .fade-in {
      animation: fadeIn 0.35s ease;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========== 工具类 ========== */
    .hidden {
      display: none;
    }
    .loading, .error {
      text-align: center;
      padding: 3rem;
      font-size: 1.1rem;
      color: var(--text-secondary);
    }
    .error {
      color: #ef4444;
    }

    /* ========== 响应式 ========== */
    @media (max-width: 600px) {
      .container { padding: 1rem 1rem 3rem; }
      .post-card { padding: 1rem; }
      .article-content { padding: 1.2rem; }
      .post-title { font-size: 1.2rem; }
      .article-content h1 { font-size: 1.5rem; }
      #backToTop {
        bottom: 1.2rem;
        right: 1.2rem;
        width: 42px;
        height: 42px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <!-- 阅读进度条 -->
  <div id="progressBar"></div>

  <div class="container">
    <!-- 头部 -->
    <header class="header">
      <div class="logo">Coastの博客</div>
      <button class="theme-toggle" id="themeToggle">🌙 暗色</button>
    </header>

    <!-- 列表视图 -->
    <div id="listView">
      <!-- 搜索框 -->
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="搜索文章标题或内容…"
          autocomplete="off"
        >
      </div>
      <div class="no-result" id="noResult">没有找到匹配的文章</div>
      <div class="loading" id="loading">正在加载文章…</div>
      <div class="error hidden" id="error">加载文章失败，请检查 articles.txt 文件是否正确。</div>
      <div id="postList"></div>
    </div>

    <!-- 详情视图 -->
    <div id="detailView" class="hidden">
      <button class="back-btn" id="backBtn">← 返回列表</button>
      <div class="article-content" id="articleContent"></div>
    </div>
  </div>

  <!-- 返回顶部按钮 -->
  <button id="backToTop" title="返回顶部">↑</button>

  <script>
    (function() {
      // ==================== 主题切换 ====================
      const themeToggle = document.getElementById('themeToggle');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      let currentTheme = localStorage.getItem('blog-theme') || (prefersDark ? 'dark' : 'light');

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        themeToggle.textContent = theme === 'dark' ? '☀️ 亮色' : '🌙 暗色';
        localStorage.setItem('blog-theme', theme);
      }
      applyTheme(currentTheme);
      themeToggle.addEventListener('click', function() {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        applyTheme(currentTheme);
      });

      // ==================== DOM 引用 ====================
      const listView = document.getElementById('listView');
      const detailView = document.getElementById('detailView');
      const postList = document.getElementById('postList');
      const articleContent = document.getElementById('articleContent');
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      const searchInput = document.getElementById('searchInput');
      const noResult = document.getElementById('noResult');
      const backToTop = document.getElementById('backToTop');
      const progressBar = document.getElementById('progressBar');

      let articles = [];

      // ==================== 动画辅助 ====================
      function triggerFadeIn(el) {
        el.classList.remove('fade-in');
        // 强制重排，确保动画重新触发
        void el.offsetWidth;
        el.classList.add('fade-in');
      }

      // ==================== 视图切换 ====================
      function showList() {
        detailView.classList.add('hidden');
        listView.classList.remove('hidden');
        triggerFadeIn(listView);
        // 滚动到顶部
        window.scrollTo({ top: 0, behavior: 'smooth' });
        // 清空搜索框
        searchInput.value = '';
        filterArticles('');
      }

      // ==================== 换行渲染 ====================
      function renderContentWithLineBreaks(text) {
        // 处理 JSON 中可能被双重转义的 \n
        let normalized = text.replace(/\\n/g, '\n');
        // 统一换行符并转为 <br>
        return normalized
          .replace(/\r\n/g, '\n')
          .replace(/\r/g, '\n')
          .replace(/\n/g, '<br>');
      }

      // ==================== 显示文章详情 ====================
      function showDetail(article) {
        // 构建安全的详情内容
        articleContent.innerHTML = '';

        const titleEl = document.createElement('h1');
        titleEl.textContent = article.title;
        articleContent.appendChild(titleEl);

        const metaEl = document.createElement('div');
        metaEl.className = 'meta';
        metaEl.textContent = article.date;
        articleContent.appendChild(metaEl);

        const bodyEl = document.createElement('div');
        bodyEl.className = 'body-text';
        bodyEl.innerHTML = renderContentWithLineBreaks(article.content);
        articleContent.appendChild(bodyEl);

        // 切换视图
        listView.classList.add('hidden');
        detailView.classList.remove('hidden');
        triggerFadeIn(detailView);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // ==================== 搜索过滤 ====================
      function filterArticles(keyword) {
        const cards = postList.querySelectorAll('.post-card');
        let visibleCount = 0;

        cards.forEach(function(card) {
          const text = card.textContent.toLowerCase();
          if (text.includes(keyword)) {
            card.style.display = '';
            visibleCount++;
          } else {
            card.style.display = 'none';
          }
        });

        // 显示/隐藏"无结果"提示
        noResult.style.display = (visibleCount === 0 && articles.length > 0) ? 'block' : 'none';
      }

      searchInput.addEventListener('input', function() {
        filterArticles(this.value.toLowerCase().trim());
      });

      // ==================== 渲染文章列表 ====================
      function renderList() {
        postList.innerHTML = '';
        noResult.style.display = 'none';

        articles.forEach(function(article, index) {
          const card = document.createElement('div');
          card.className = 'post-card';
          card.setAttribute('data-index', index);

          // 标题（含置顶标识）
          const titleEl = document.createElement('h2');
          titleEl.className = 'post-title';
          if (article.pinned) {
            const badge = document.createElement('span');
            badge.className = 'pin-badge';
            badge.textContent = '📌';
            titleEl.appendChild(badge);
          }
          const titleText = document.createTextNode(article.title);
          titleEl.appendChild(titleText);
          card.appendChild(titleEl);

          // 日期
          const dateEl = document.createElement('div');
          dateEl.className = 'post-date';
          dateEl.textContent = article.date;
          card.appendChild(dateEl);

          // 摘要
          const excerptEl = document.createElement('p');
          excerptEl.className = 'post-excerpt';
          excerptEl.textContent = article.content.replace(/\\n/g, ' ').substring(0, 120) + '…';
          card.appendChild(excerptEl);

          // 点击事件
          card.addEventListener('click', function() {
            const idx = parseInt(card.getAttribute('data-index'), 10);
            if (articles[idx]) {
              showDetail(articles[idx]);
            }
          });

          postList.appendChild(card);
        });
      }

      // ==================== 加载文章数据 ====================
      async function loadArticles() {
        try {
          const response = await fetch('articles.txt');
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const text = await response.text();
          const data = JSON.parse(text);
          if (!Array.isArray(data)) throw new Error('articles.txt 必须是一个 JSON 数组');

          // 排序：置顶文章排在最前面
          articles = data.sort(function(a, b) {
            if (a.pinned && !b.pinned) return -1;
            if (!a.pinned && b.pinned) return 1;
            return 0;
          });

          loadingEl.classList.add('hidden');
          renderList();
        } catch (err) {
          console.error('加载文章失败:', err);
          loadingEl.classList.add('hidden');
          errorEl.classList.remove('hidden');
        }
      }

      // ==================== 进度条 ====================
      function updateProgressBar() {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        if (docHeight <= 0) {
          progressBar.style.width = '0%';
          return;
        }
        const progress = Math.min((scrollTop / docHeight) * 100, 100);
        progressBar.style.width = progress + '%';
      }
      window.addEventListener('scroll', updateProgressBar, { passive: true });
      // 初始更新
      updateProgressBar();

      // ==================== 返回顶部按钮 ====================
      function updateBackToTop() {
        if (window.scrollY > 400) {
          backToTop.classList.add('visible');
        } else {
          backToTop.classList.remove('visible');
        }
      }
      window.addEventListener('scroll', updateBackToTop, { passive: true });
      updateBackToTop();

      backToTop.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // ==================== 返回列表按钮 ====================
      document.getElementById('backBtn').addEventListener('click', showList);

      // ==================== 启动 ====================
      loadArticles();
    })();
  </script>
</body>
</html>
